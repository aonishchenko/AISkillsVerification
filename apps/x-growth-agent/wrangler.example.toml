name = "x-growth-agent"
main = "src/index.ts"
compatibility_date = "2026-05-24"
compatibility_flags = ["nodejs_compat"]

# Workers AI: free-tier model used for curation, drafting, the editor gate,
# and the daily strategy rewrite. No external LLM key required.
[ai]
binding = "AI"

# Durable Object that holds the long-lived, stateful agent (Cloudflare Agents
# pattern). One instance owns the create + learn loops and serializes posting.
[[durable_objects.bindings]]
name = "AGENT"
class_name = "XGrowthAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["XGrowthAgent"]

# D1 is the knowledge base: candidates, published posts, pending metric checks,
# pattern performance scores, and the current strategy.
[[d1_databases]]
binding = "DB"
database_name = "x_growth_agent"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Two cron triggers drive the whole system with zero human involvement.
#   - create loop: runs often; an internal day-budget caps it at 1-4 posts/day
#   - learn loop:  once daily; pulls 24-48h engagement and rewrites strategy
[triggers]
crons = ["0 13,17,21 * * *", "30 6 * * *"]

[vars]
# Posting cadence guardrails.
MAX_POSTS_PER_DAY = "4"
MIN_MINUTES_BETWEEN_POSTS = "180"
# Brand / voice config (see src/config.ts for the full default).
ACCOUNT_NICHE = "AI automation and AI agent security"
WEBSITE_URL = "https://safeskillmd.com/"
# Comma-separated RSS feeds: your blog, AI-security news, Google News queries,
# and a LinkedIn RSS-bridge URL for your public posts.
RSS_FEEDS = "https://safeskillmd.com/blog/rss.xml"
# Telegram channels are read via the official Bot API (compliant, not scraping).
# TELEGRAM_BOT_TOKEN  -> wrangler secret put TELEGRAM_BOT_TOKEN
TELEGRAM_CHAT_IDS = ""

# LLM provider for drafting, scoring, the editor gate, and strategy rewrites.
#   "workers-ai" -> free Cloudflare models (CF_*_MODEL below)
#   "anthropic"  -> Claude (better voice/editing/strategy; ~$3-5/mo at this volume)
# Embeddings for the novelty signal always use Cloudflare's free model.
LLM_PROVIDER = "anthropic"

# Cloudflare AI model ids (used when LLM_PROVIDER = "workers-ai").
CF_WRITER_MODEL = "@cf/meta/llama-3.3-70b-instruct"
CF_RANKER_MODEL = "@cf/meta/llama-3.3-70b-instruct"

# Claude model ids (used when LLM_PROVIDER = "anthropic").
# Sonnet writes/edits/strategizes; Haiku handles the cheap scoring calls.
ANTHROPIC_MODEL_WRITER = "claude-sonnet-4-6"
ANTHROPIC_MODEL_RANKER = "claude-haiku-4-5-20251001"

# --- Secrets (set with `wrangler secret put NAME`) ---
# X API v2 OAuth (user context, required to POST tweets and read organic metrics):
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET
# Claude (required when LLM_PROVIDER = "anthropic"):
#   ANTHROPIC_API_KEY
# Optional Telegram ingestion:
#   TELEGRAM_BOT_TOKEN
